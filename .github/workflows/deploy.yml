name: Build and Deploy

on:
  push:
    branches: [main, uat, dev]

permissions:
  id-token: write
  contents: read

env:
  REGISTRY: acorntoolsregistry.azurecr.io
  IMAGE: acorndrive

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set environment from branch
        run: |
          if [ "${{ github.ref_name }}" = "main" ]; then
            echo "ENV=prod" >> $GITHUB_ENV
            echo "CONTAINER_APP=acorndrive-prod" >> $GITHUB_ENV
            echo "CONFIG_FILE=config.prod.yaml" >> $GITHUB_ENV
          elif [ "${{ github.ref_name }}" = "uat" ]; then
            echo "ENV=uat" >> $GITHUB_ENV
            echo "CONTAINER_APP=acorndrive-uat" >> $GITHUB_ENV
            echo "CONFIG_FILE=config.uat.yaml" >> $GITHUB_ENV
          else
            echo "ENV=dev" >> $GITHUB_ENV
            echo "CONTAINER_APP=acorndrive-dev" >> $GITHUB_ENV
            echo "CONFIG_FILE=config.dev.yaml" >> $GITHUB_ENV
          fi

      - name: Azure login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Log in to ACR
        run: az acr login --name acorntoolsregistry

      - name: Generate config from template
        env:
          AUTH_KEY_DEV:  ${{ secrets.AUTH_KEY_DEV }}
          AUTH_KEY_UAT:  ${{ secrets.AUTH_KEY_UAT }}
          AUTH_KEY_PROD: ${{ secrets.AUTH_KEY_PROD }}
          CHAINFS_CLIENT_SECRET_DEV:  ${{ secrets.CHAINFS_CLIENT_SECRET_DEV }}
          CHAINFS_CLIENT_SECRET_UAT:  ${{ secrets.CHAINFS_CLIENT_SECRET_UAT }}
          CHAINFS_CLIENT_SECRET_PROD: ${{ secrets.CHAINFS_CLIENT_SECRET_PROD }}
        run: |
          case "$ENV" in
            prod) AUTH_KEY="$AUTH_KEY_PROD"; CLIENT_SECRET="$CHAINFS_CLIENT_SECRET_PROD" ;;
            uat)  AUTH_KEY="$AUTH_KEY_UAT";  CLIENT_SECRET="$CHAINFS_CLIENT_SECRET_UAT"  ;;
            *)    AUTH_KEY="$AUTH_KEY_DEV";  CLIENT_SECRET="$CHAINFS_CLIENT_SECRET_DEV"  ;;
          esac
          cp backend/config.${ENV}.yaml.example backend/config.${ENV}.yaml
          sed -i "s|__AUTH_KEY__|${AUTH_KEY}|g"                   backend/config.${ENV}.yaml
          # prod keeps the ChainFS client secret OUT of the (public) yaml — it is injected as a
          # Container App secret in the Deploy step below. dev/uat still use the yaml placeholder.
          if [ "$ENV" != "prod" ]; then
            sed -i "s|__CHAINFS_CLIENT_SECRET__|${CLIENT_SECRET}|g" backend/config.${ENV}.yaml
          fi

      - name: Build and push Docker image
        run: |
          SHA_TAG=$REGISTRY/$IMAGE:$ENV-${GITHUB_SHA:0:7}
          docker build --no-cache -t $SHA_TAG -f _docker/Dockerfile \
            --build-arg CONFIG_FILE=$CONFIG_FILE \
            --build-arg REVISION=$GITHUB_SHA \
            .
          docker tag $SHA_TAG $REGISTRY/$IMAGE:$ENV
          docker push $SHA_TAG
          docker push $REGISTRY/$IMAGE:$ENV
          echo "SHA_TAG=$SHA_TAG" >> $GITHUB_ENV

      - name: Deploy to Container App
        env:
          FILEBROWSER_CHAINFS_CLIENT_SECRET: ${{ secrets.FILEBROWSER_CHAINFS_CLIENT_SECRET }}
        run: |
          az containerapp registry set \
            --name $CONTAINER_APP \
            --resource-group rg-acornDrive \
            --server $REGISTRY \
            --identity system

          # Inject the ChainFS B2C client secret as a Container App secret (never into the image
          # or any yaml), referenced by the FILEBROWSER_CHAINFS_CLIENT_SECRET env var. prod only.
          EXTRA_ENV=""
          if [ "$ENV" = "prod" ] && [ -n "$FILEBROWSER_CHAINFS_CLIENT_SECRET" ]; then
            az containerapp secret set \
              --name $CONTAINER_APP \
              --resource-group rg-acornDrive \
              --secrets chainfs-client-secret="$FILEBROWSER_CHAINFS_CLIENT_SECRET"
            EXTRA_ENV="--set-env-vars FILEBROWSER_CHAINFS_CLIENT_SECRET=secretref:chainfs-client-secret"
          fi

          az containerapp update \
            --name $CONTAINER_APP \
            --resource-group rg-acornDrive \
            --image $SHA_TAG \
            --revision-suffix "gh${GITHUB_SHA:0:7}" \
            $EXTRA_ENV
